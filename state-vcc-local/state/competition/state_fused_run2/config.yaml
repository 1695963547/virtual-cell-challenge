data:
  name: PerturbationDataModule
  kwargs:
    toml_config_path: competition_support_set/starter.toml
    embed_key: null
    output_space: gene
    pert_rep: onehot
    basal_rep: sample
    num_workers: 48
    pin_memory: true
    n_basal_samples: 1
    downsample: null
    downsample_cells: null
    additional_obs: []
    basal_mapping_strategy: random
    should_yield_control_cells: true
    batch_col: batch_var
    pert_col: target_gene
    cell_type_key: cell_type
    control_pert: non-targeting
    map_controls: true
    perturbation_features_file: competition_support_set/ESM2_pert_features.pt
    store_raw_basal: false
    int_counts: false
    barcode: true
    use_consecutive_loading: false
    val_subsample_fraction: 1.0
  output_dir: null
  debug: true
model:
  name: state
  checkpoint: null
  device: cuda
  kwargs:
    cell_set_len: 128
    blur: 0.05
    hidden_dim: 768
    loss: fused
    confidence_token: false
    n_encoder_layers: 1
    n_decoder_layers: 1
    predict_residual: true
    softplus: true
    freeze_pert_backbone: false
    transformer_decoder: false
    finetune_vci_decoder: false
    residual_decoder: false
    batch_encoder: false
    use_batch_token: false
    mask_attn: false
    log1p_from_raw_counts: false
    counts_target_sum: 10000
    use_effect_gating_token: false
    distributional_loss: energy
    init_from: null
    mmd_num_chunks: 1
    randomize_mmd_chunks: false
    llm_name: null
    transformer_backbone_key: llama
    transformer_backbone_kwargs:
      bidirectional_attention: true
      max_position_embeddings: 128
      hidden_size: 768
      intermediate_size: 3072
      num_hidden_layers: 8
      num_attention_heads: 12
      num_key_value_heads: 12
      head_dim: 64
      use_cache: false
      attention_dropout: 0.0
      hidden_dropout: 0.0
      layer_norm_eps: 1.0e-06
      pad_token_id: 0
      bos_token_id: 1
      eos_token_id: 2
      tie_word_embeddings: false
      rotary_dim: 0
      use_rotary_embeddings: false
    lora:
      enable: false
      r: 16
      alpha: 32
      dropout: 0.05
      bias: none
      target: auto
      adapt_mlp: false
      task_type: FEATURE_EXTRACTION
      merge_on_eval: false
training:
  wandb_track: true
  weight_decay: 0.0005
  batch_size: 64
  lr: 0.0001
  max_steps: 8000
  train_seed: 42
  val_freq: 2000
  ckpt_every_n_steps: 2000
  keep_all_ckpts: false
  gradient_clip_val: 10
  gradient_accumulation_steps: 1
  loss_fn: mse
  devices: 1
  strategy: auto
  use_mfu: false
  mfu_kwargs:
    available_flops: 60000000000000.0
    use_backward: true
    logging_interval: 10
    window_size: 2
  cumulative_flops_use_backward: true
wandb:
  entity: your_entity_name
  project: state
  local_wandb_dir: ./wandb_logs
  tags: []
name: state_fused_run2
output_dir: competition
use_wandb: false
overwrite: false
return_adatas: false
pred_adata_path: null
true_adata_path: null
