wandb_track: true
weight_decay: 0.0005
batch_size: 16
lr: 1e-4
max_steps: 400000
train_seed: 42
val_freq: 2000
ckpt_every_n_steps: 2000
# 置为 true 时额外保留每 ckpt_every_n_steps 步的中间 checkpoint（不只是 best/last），
# 便于事后把指标画成训练步数的函数。会显著占磁盘（每个 checkpoint 约 1.4G）。
keep_all_ckpts: false
gradient_clip_val: 10 # 0 means no clipping
gradient_accumulation_steps: 1
loss_fn: mse
devices: 1  # Number of GPUs to use for training
strategy: auto  # DDP strategy for multi-GPU training
use_mfu: false
mfu_kwargs:
    available_flops: 60e12
    use_backward: true
    logging_interval: 10
    window_size: 2
cumulative_flops_use_backward: true
